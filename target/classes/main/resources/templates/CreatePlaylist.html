<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create playlist</title>
    <link href="/static/css/CreatePlaylist.css" rel="stylesheet">
</head>

<body>
    <div id="TrackDisplay">
        <div class="Track"
             th:each= "track : ${tracks}"
             onclick="toggleSong(this)">

            <a th:herf="${track.trackImgUrl}"
               th:alt="${track.trackName}"></a>

            <h3 th:text="${track.trackName}"></h3>

            <p th:text="${track.artistName}"></p>
        </div>
    </div>

    <button onclick="submitSongs()">Save Songs</button>

    <form action="CreatePlaylist" method="post">

        <div class="data-field">
            <label for="Pname">Playlist name</label>
            <input type="text" id="Pname" name="playlistName" required>
        </div>

        <div class="data-field">
            <label for="Description">Playlist description</label>
            <input type="text" id="Description" name="playlistDescription" required>
        </div>

        <button type="submit">Create Playlist</button>
    </form>
</body>
</html>
